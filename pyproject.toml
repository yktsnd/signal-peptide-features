[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-peptide-features"
version = "0.2.0"
description = "Lightweight sequence-derived signal peptide feature calculation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3"]

[project.scripts]
sp-features = "signal_peptide_features.cli:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
